name: CI MLflow Pipeline

on:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install mlflow pandas scikit-learn matplotlib

      # RUN MLFLOW PROJECT (FIX)
      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local

      # SAVE ARTIFACT
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: mlruns

      # BUILD DOCKER IMAGE
      - name: Build Docker Image
        run: |
          mlflow models build-docker --m mlruns/0/*/artifacts/model -n heart-model

      # LOGIN DOCKER HUB
      - name: Login DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # TAG IMAGE
      - name: Tag Docker Image
        run: |
          docker tag heart-model ${{ secrets.DOCKER_USERNAME }}/mlflow-heart:latest

      # PUSH IMAGE
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-heart:latest