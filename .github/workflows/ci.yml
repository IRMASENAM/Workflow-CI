name: CI MLflow Pipeline

on:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2 Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3 Install dependencies
      - name: Install Dependencies
        run: |
          pip install mlflow pandas scikit-learn matplotlib

      # 4 Run MLflow Project
      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local

      # 5 Check artifact structure
      - name: Check MLflow Artifacts
        run: |
          ls -R mlruns

      # 6 Upload artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: mlruns

      # 7 Build Docker Image
      - name: Build Docker Image
        run: |
          EXP_ID=$(ls mlruns | head -n 1)
          RUN_ID=$(ls mlruns/$EXP_ID | head -n 1)
          mlflow models build-docker -m mlruns/$EXP_ID/$RUN_ID/artifacts/model -n heart-model

      # 8 Login DockerHub
      - name: Login DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 9 Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag heart-model ${{ secrets.DOCKER_USERNAME }}/mlflow-heart:latest

      # 10 Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-heart:latest