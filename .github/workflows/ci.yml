name: CI Workflow

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install pandas scikit-learn matplotlib mlflow

      - name: Run Training
        run: |
          python MLProject/modelling.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: .

      - name: Build Docker Image
        run: |
          pip install mlflow
          mlflow build-docker -n heart-model MLProject

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag Docker Image
        run: |
          docker tag heart-model ${{ secrets.DOCKER_USERNAME }}/mlflow-heart-disease:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-heart-disease:latest