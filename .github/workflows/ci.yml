name: CI MLflow Pipeline

on:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        pip install mlflow==2.19.0 pandas scikit-learn matplotlib

    - name: Run MLflow Project
      run: |
        mlflow run MLProject --env-manager=local

    - name: Check MLflow Artifacts
      run: |
        ls -R mlruns

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: mlruns

    - name: Build Docker Image
      run: |

        EXP_ID=$(ls mlruns | grep -v ".trash" | head -n 1)
        RUN_ID=$(ls mlruns/$EXP_ID | grep -v "meta.yaml" | head -n 1)

        mlflow models build-docker \
          -m mlruns/$EXP_ID/$RUN_ID/artifacts/model \
          -n heart-model

    - name: Login DockerHub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Tag Docker Image
      run: |
        docker tag heart-model ${{ secrets.DOCKER_USERNAME }}/mlflow-heart:latest

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-heart:latest